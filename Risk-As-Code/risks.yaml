project: "Enterprise AI Infrastructure GRC"
framework: "NIST AI RMF / ISO 42001"
risk_methodology:
  likelihood_scale: "1-5"
  impact_scale: "1-5"
  scoring: "likelihood x impact"
  ratings:
    low: "1-4"
    medium: "5-9"
    high: "10-15"
    critical: "16-25"
  escalation: "Open High/Critical risks require escalation"
risks:
  - id: "RISK-001"
    category: "AI Governance"
    description: "Lack of continuous validation for automated training data inputs."
    likelihood: 4
    impact: 5
    status: "Open"
    mitigation: "Implement OPA checks in CI/CD and establish recurring validation evidence."
    control_area: "AI governance / data quality"

  - id: "RISK-002"
    category: "Access Control"
    description: "Privileged accounts lacking automated credential rotation enforcement."
    likelihood: 3
    impact: 4
    status: "Open"
    mitigation: "Enforce automated secret rotation through an approved secrets-management service."
    control_area: "Privileged access management"

  - id: "RISK-003"
    category: "Data Privacy"
    description: "Third-party vendor telemetry logging unmasked user metadata."
    likelihood: 2
    impact: 3
    status: "Mitigated"
    mitigation: "Deploy data-masking middleware and retain validation evidence."
    control_area: "Data protection / privacy"
